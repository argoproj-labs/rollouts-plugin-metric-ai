apiVersion: argoproj.io/v1alpha1
kind: RolloutManager
metadata:
  name: argo-rollouts
  namespace: argo-rollouts
spec:
  namespaceScoped: true
  env:
    - name: LOG_LEVEL
      value: debug
  extraCommandArgs:
    - --loglevel
    - debug
  plugins:
    metric:
      - name: argoproj-labs/metric-ai
        location: http://plugin-server.argo-rollouts.svc.cluster.local/rollouts-plugin-metric-ai
